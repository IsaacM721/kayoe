name = "kayoe-excursiones"
compatibility_date = "2024-01-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "kayoe-db"
database_id = "9ac41340-5d2f-44d1-96ad-d5d55b5eb7d3"

[vars]
PAYPAL_ENVIRONMENT = "production"
KAYOE_EMAIL = "reservas@kayoeexcursiones.com"

# The following are set as secrets directly on the Cloudflare Pages project
# (Settings > Environment variables) -- never committed here:
#
#   PAYPAL_CLIENT_ID       (public, but still stored as a secret for convenience)
#   PAYPAL_CLIENT_SECRET   real/live credentials -- verify with GET /api/paypal/health
#   PAYPAL_WEBHOOK_ID      from PayPal Dashboard > Apps & Credentials > Webhooks,
#                          after adding https://kayoeexcursiones.com/api/paypal/webhook
#                          subscribed to the PAYMENT.CAPTURE.COMPLETED event
#   RESEND_API_KEY         from resend.com, after verifying kayoeexcursiones.com
#                          as a sending domain (adds DNS records alongside the
#                          existing Zoho MX record -- does not replace it, Zoho
#                          keeps receiving mail at reservas@ exactly as today)
